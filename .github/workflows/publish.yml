name: Refresh and publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check chart calculations
        run: node tests/test_windows.cjs
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.26'
      - name: Refresh prices and headlines
        run: python3 scripts/update_data.py
      - name: Check data and session mapping
        run: python3 -m unittest discover -s tests -v
      - name: Render Quarto site
        run: quarto render
      - name: Save refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh weekly market data and news [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
